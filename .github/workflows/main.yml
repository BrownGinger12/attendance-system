name: Test Python App & Trigger Webhook

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-trigger:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install requests

    - name: Run app briefly and test endpoint
      run: |
        # Start the app in the background
        pwd
        ls -R
        
        nohup python app.py &
        APP_PID=$!
        echo "App started with PID $APP_PID"

        # Wait a few seconds for the app to start
        sleep 5

        # Test the main endpoint
        python - <<'EOF'
        import requests
        import sys
        
        try:
            response = requests.get("http://127.0.0.1:5000/")  # Change port if needed
            assert response.status_code == 200
            print("✅ Endpoint responded successfully:", response.json())
        except Exception as e:
            print("❌ Endpoint test failed:", e)
            sys.exit(1)
        EOF
        
                # Kill the app after testing
                kill $APP_PID
                echo "App stopped"

    - name: Send webhook request
      run: |
        WEBHOOK_URL="https://api.selim-dev.online/update"
        SECRET="${{ secrets.WEBHOOK_SECRET }}"
        BODY='{"ref":"main"}'
    
        SIGNATURE=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
    
        curl -X POST $WEBHOOK_URL \
             -H "Content-Type: application/json" \
             -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
             -d "$BODY"
